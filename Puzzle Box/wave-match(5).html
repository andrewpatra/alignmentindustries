<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Tuner — Model 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chassis: #ddd0ab;
    --chassis-hi: #ece0bf;
    --chassis-lo: #b9a575;
    --panel-face: #e7dcc0;
    --panel-edge: #8d7a51;
    --ink: #2a2117;
    --ink-dim: #6e5f46;
    --brass: #a9802b;
    --brass-hi: #e8cd84;
    --crt-bg: #04100b;
    --crt-grid: #123028;
    --target: #ffb238;
    --target-dim: #8a6a2a;
    --user: #1f8f58;
    --user-glow: #3dff9e;
    --danger: #9c2a1e;
    --lamp-off: #847757;
    --win-ink: #8a6a14;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--chassis-hi), var(--chassis-lo) 140%);
    color: var(--ink);
    font-family: 'Oswald', sans-serif;
  }
  .rig{
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 22px 28px;
    position: relative;
    background: linear-gradient(180deg, var(--chassis-hi), var(--chassis) 40%, var(--chassis-lo));
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 18px 36px rgba(20,14,0,0.35);
  }
  .screw{
    position:absolute;
    width:12px; height:12px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff4d6, var(--brass) 55%, #6b4f14 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .screw::after{
    content:"";
    position:absolute; left:2px; right:2px; top:50%;
    height:1.5px; background: rgba(40,28,8,0.6);
    transform: translateY(-50%) rotate(28deg);
  }
  .screw.tl{ top:10px; left:10px; }
  .screw.tr{ top:10px; right:10px; }
  .screw.bl{ bottom:10px; left:10px; }
  .screw.br{ bottom:10px; right:10px; }

  .header{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--panel-edge);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .header h1{
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 0;
    color: var(--ink);
    text-transform: uppercase;
  }
  .header .sub{
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--ink-dim);
    margin-top: 2px;
    text-transform: uppercase;
  }
  .badge{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #2d2206;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    border: 1px solid #6b4f14;
    border-radius: 3px;
    padding: 5px 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 1px 2px rgba(0,0,0,0.3);
    white-space: nowrap;
  }

  .screen-wrap{
    background: #0a0a08;
    border: 6px solid #15110b;
    border-radius: 8px;
    padding: 10px;
    box-shadow:
      0 0 0 2px #3a2f1e,
      0 0 0 3px #0a0a08,
      inset 0 0 12px rgba(0,0,0,0.6);
  }
  .screen-label{
    font-size: 10px;
    letter-spacing: 2px;
    color: #a89a78;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  canvas{
    display:block;
    width: 100%;
    height: 240px;
    background: var(--crt-bg);
    border-radius: 2px;
  }

  .meters-row{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 14px;
    margin-top: 14px;
  }
  .meter-card{
    background: var(--panel-face);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 10px 10px 8px;
    text-align:center;
  }
  .gauge{ width: 100%; height: auto; display:block; }
  .meter-caption{
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--ink-dim);
    margin-top: 4px;
    text-transform: uppercase;
  }

  .nixie-row{
    display:flex;
    justify-content:center;
    gap: 2px;
    margin: 4px 0 2px;
  }
  .nixie-digit{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width: 15px;
    height: 22px;
    background: radial-gradient(ellipse at 50% 30%, #241a10, #0c0804 75%);
    border: 1px solid #3a2a14;
    border-radius: 50% 50% 20% 20%;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 15px;
    color: #ff8a3d;
    text-shadow: 0 0 4px #ff6a1a, 0 0 8px #ff6a1a88;
  }
  .nixie-digit.small{ min-width:12px; height:18px; font-size:12px; }

  .hold-ladder{
    display:flex;
    gap: 3px;
    justify-content:center;
    align-items:flex-end;
    height: 46px;
    margin: 6px 0 2px;
  }
  .hold-seg{
    width: 10px;
    flex: 0 0 auto;
    height: 100%;
    background: #2a2416;
    border: 1px solid #4a3f28;
    border-radius: 2px;
  }
  .hold-seg.lit{
    background: linear-gradient(180deg, var(--target), #c77b10);
    box-shadow: 0 0 6px var(--target);
  }

  .status-line{
    margin-top: 12px;
    font-size: 13px;
    min-height: 18px;
    color: var(--ink-dim);
    text-align:center;
    letter-spacing: 0.4px;
  }
  .status-line.win{ color: var(--win-ink); font-weight: 600; }

  .panels{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 16px;
  }
  .panel{
    background: var(--panel-face);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 12px 12px 14px;
  }
  .panel-title{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--ink);
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--panel-edge);
    display:flex;
    align-items:center;
    gap: 6px;
    text-transform: uppercase;
  }
  .panel-title .dot{
    width: 8px; height: 8px; border-radius: 50%;
  }
  .dot.tgt{ background: var(--target); box-shadow: 0 0 4px var(--target); }
  .dot.usr{ background: var(--user-glow); box-shadow: 0 0 4px var(--user-glow); }

  .lamp-row{
    display:flex;
    gap: 10px;
    justify-content: space-around;
    margin: 6px 0 12px;
  }
  .lamp{
    background: none;
    border: none;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 5px;
    cursor: default;
    font-family: inherit;
  }
  button.lamp{ cursor: pointer; }
  .lamp-bulb{
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a5340, var(--lamp-off) 70%);
    border: 2px solid #5c5236;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4) inset;
  }
  .lamp.lit .lamp-bulb{
    background: radial-gradient(circle at 35% 30%, #fff1c9, var(--target) 60%, #a96a12);
    border-color: #6b4f14;
    box-shadow: 0 0 10px var(--target), 0 0 4px #fff2 inset;
  }
  button.lamp.lit .lamp-bulb{
    background: radial-gradient(circle at 35% 30%, #d9ffe9, var(--user-glow) 60%, var(--user));
    border-color: #0f4a2c;
    box-shadow: 0 0 10px var(--user-glow), 0 0 4px #fff2 inset;
  }
  .lamp-label{
    font-size: 9.5px;
    letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .lamp.lit .lamp-label{ color: var(--ink); font-weight: 600; }

  .readout-row{
    display:flex;
    gap: 10px;
  }
  .readout-block{ flex:1; text-align:center; }
  .readout-label{
    font-size: 9.5px;
    letter-spacing: 1px;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .dial-row{
    display:flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .dial-block{ flex:1; text-align:center; }
  .dial-block .gauge{ max-width: 150px; margin: 0 auto; }

  input[type=range]{
    width: 100%;
    -webkit-appearance: none;
    height: 4px;
    margin-top: 6px;
    background: linear-gradient(90deg, #6e5f3e, #8d7a51);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass));
    border: 1px solid #5c4410;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  input[type=range]::-moz-range-thumb{
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass));
    border: 1px solid #5c4410;
    cursor: pointer;
  }

  .controls-foot{
    display:flex;
    justify-content: center;
    margin-top: 18px;
  }
  .newround{
    background: linear-gradient(180deg, #4a4030, #2a2416);
    color: #e8dcc0;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    border: 1px solid #1a160d;
    border-radius: 5px;
    padding: 10px 22px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 2px 4px rgba(0,0,0,0.3);
  }
  .newround:hover{ background: linear-gradient(180deg, #5a4e3a, #332c1c); }
  .newround:active{ box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
</style>
</head>
<body>
<div class="rig">
  <div class="screw tl"></div>
  <div class="screw tr"></div>
  <div class="screw bl"></div>
  <div class="screw br"></div>

  <div class="header">
    <div>
      <h1>Signal Tuner</h1>
      <div class="sub">Model 100 · Match the Target Trace</div>
    </div>
    <div class="badge" id="roundBadge">LEVEL 1/3</div>
  </div>

  <div class="screen-wrap">
    <div class="screen-label">Oscilloscope Display</div>
    <canvas id="scope"></canvas>
  </div>

  <div class="meters-row">
    <div class="meter-card">
      <svg class="gauge" id="lockGauge" viewBox="0 0 200 125"></svg>
      <div class="nixie-row" id="lockNixie"></div>
      <div class="meter-caption">Lock %</div>
    </div>
    <div class="meter-card">
      <div class="hold-ladder" id="holdLadder"></div>
      <div class="meter-caption" id="holdCaption">Hold 0.0s / 1.5s</div>
    </div>
  </div>

  <div class="status-line" id="statusLine">Match the target to start the hold.</div>

  <div class="panels">
    <div class="panel">
      <p class="panel-title"><span class="dot tgt"></span>Target</p>
      <div class="lamp-row" id="targetLamps">
        <div class="lamp" data-shape="sine"><span class="lamp-bulb"></span><span class="lamp-label">SINE</span></div>
        <div class="lamp" data-shape="square"><span class="lamp-bulb"></span><span class="lamp-label">SQUARE</span></div>
        <div class="lamp" data-shape="saw"><span class="lamp-bulb"></span><span class="lamp-label">SAW</span></div>
      </div>
      <div class="readout-row">
        <div class="readout-block">
          <div class="nixie-row" id="tgtAmp"></div>
          <div class="readout-label">Amplitude</div>
        </div>
        <div class="readout-block">
          <div class="nixie-row" id="tgtFreq"></div>
          <div class="readout-label">Frequency (Hz)</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <p class="panel-title"><span class="dot usr"></span>Your Trace</p>
      <div class="dial-row">
        <div class="dial-block">
          <svg class="gauge" id="ampGauge" viewBox="0 0 200 125"></svg>
          <div class="nixie-row" id="ampVal"></div>
          <div class="readout-label">Amplitude</div>
          <input type="range" id="ampSlider" min="0.1" max="2" step="0.01" value="1">
        </div>
        <div class="dial-block">
          <svg class="gauge" id="freqGauge" viewBox="0 0 200 125"></svg>
          <div class="nixie-row" id="freqVal"></div>
          <div class="readout-label">Frequency (Hz)</div>
          <input type="range" id="freqSlider" min="0.2" max="4" step="0.01" value="1">
        </div>
      </div>
      <div class="lamp-row">
        <button class="lamp shape-btn" data-shape="sine"><span class="lamp-bulb"></span><span class="lamp-label">SINE</span></button>
        <button class="lamp shape-btn" data-shape="square"><span class="lamp-bulb"></span><span class="lamp-label">SQUARE</span></button>
        <button class="lamp shape-btn" data-shape="saw"><span class="lamp-bulb"></span><span class="lamp-label">SAW</span></button>
      </div>
    </div>
  </div>

  <div class="controls-foot">
    <button class="newround" id="restartBtn">Reset</button>
  </div>

</div>

<script>
(function(){
  const canvas = document.getElementById('scope');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // ---- state ----
  let target = { shape:'sine', amp:1, freq:1 };
  let user = { shape:'sine', amp:1, freq:1 };
  let t0 = performance.now();

  const HOLD_MS = 1500;
  const QUIZ_LEN = 3;
  let quizDone = false;
  let quizIndex = 0;
  let holdStart = null;

  const shapeNames = { sine:'Sine', square:'Square', saw:'Saw' };

  function waveAt(shape, amp, freq, x){
    // x in "cycles" units (already includes freq and time)
    const cyclePos = x - Math.floor(x); // 0..1
    let v;
    if(shape === 'sine'){
      v = Math.sin(cyclePos * Math.PI * 2);
    } else if(shape === 'square'){
      v = cyclePos < 0.5 ? 1 : -1;
    } else { // saw
      v = (cyclePos * 2) - 1;
    }
    return v * amp;
  }

  function easeInOutQuad(t){
    return t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;
  }

  // Begin a smooth crossfade from a wave object's current shape to a new one.
  function startMorph(obj, newShape, duration){
    if(obj.shape === newShape && !obj.morph) return;
    const fromShape = obj.morph ? obj.morph.to : obj.shape;
    obj.morph = { from: fromShape, to: newShape, start: performance.now(), duration };
    obj.shape = newShape;
  }

  // Value of a wave object at a given x-domain position, blending shapes during a morph.
  function valueFor(obj, xdom){
    if(obj.morph){
      const t = (performance.now() - obj.morph.start) / obj.morph.duration;
      if(t >= 1){
        obj.morph = null;
      } else {
        const ease = easeInOutQuad(Math.max(0, t));
        const a = waveAt(obj.morph.from, obj.amp, obj.freq, xdom * obj.freq);
        const b = waveAt(obj.morph.to, obj.amp, obj.freq, xdom * obj.freq);
        return a + (b - a) * ease;
      }
    }
    return waveAt(obj.shape, obj.amp, obj.freq, xdom * obj.freq);
  }

  // ---- Nixie-tube style numeric readouts ----
  function renderNixie(el, str){
    el.innerHTML = '';
    for(const ch of str){
      const span = document.createElement('span');
      span.className = 'nixie-digit';
      span.textContent = ch;
      el.appendChild(span);
    }
  }

  // ---- VU-style radial gauges ----
  const GAUGE_MIN_ANGLE = -55, GAUGE_MAX_ANGLE = 55, GCX = 100, GCY = 112;

  function gaugePoint(r, angleDeg){
    const rad = angleDeg * Math.PI / 180;
    return [GCX + r*Math.sin(rad), GCY - r*Math.cos(rad)];
  }

  function svgEl(name, attrs){
    const e = document.createElementNS('http://www.w3.org/2000/svg', name);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function buildGauge(svg, min, max, labelVals, redZoneFrac){
    svg.innerHTML = '';
    const [x1,y1] = gaugePoint(95, GAUGE_MIN_ANGLE);
    const [x2,y2] = gaugePoint(95, GAUGE_MAX_ANGLE);
    svg.appendChild(svgEl('path', { d:`M ${x1} ${y1} A 95 95 0 0 1 ${x2} ${y2}`, fill:'none', stroke:'#b7a060', 'stroke-width':13, 'stroke-linecap':'round' }));

    if(redZoneFrac !== undefined){
      const redAngle = GAUGE_MIN_ANGLE + (GAUGE_MAX_ANGLE-GAUGE_MIN_ANGLE)*redZoneFrac;
      const [rx,ry] = gaugePoint(95, redAngle);
      svg.appendChild(svgEl('path', { d:`M ${rx} ${ry} A 95 95 0 0 1 ${x2} ${y2}`, fill:'none', stroke:'#9c2a1e', 'stroke-width':13, 'stroke-linecap':'round' }));
    }

    const tickCount = 10;
    for(let i=0;i<=tickCount;i++){
      const t = i/tickCount;
      const angle = GAUGE_MIN_ANGLE + (GAUGE_MAX_ANGLE-GAUGE_MIN_ANGLE)*t;
      const major = (i % 2 === 0);
      const [ox,oy] = gaugePoint(87, angle);
      const [ix,iy] = gaugePoint(major ? 70 : 78, angle);
      svg.appendChild(svgEl('line', { x1:ix, y1:iy, x2:ox, y2:oy, stroke:'#2a2117', 'stroke-width': major?2:1 }));
    }

    labelVals.forEach((val, i)=>{
      const t = i/(labelVals.length-1);
      const angle = GAUGE_MIN_ANGLE + (GAUGE_MAX_ANGLE-GAUGE_MIN_ANGLE)*t;
      const [lx,ly] = gaugePoint(56, angle);
      const txt = svgEl('text', { x:lx, y:ly+3, fill:'#2a2117', 'font-size':11, 'text-anchor':'middle', 'font-family':'Oswald, sans-serif', 'font-weight':600 });
      txt.textContent = val;
      svg.appendChild(txt);
    });

    const needle = svgEl('line', { x1:GCX, y1:GCY, x2:GCX, y2:GCY-78, stroke:'#2a2117', 'stroke-width':3, 'stroke-linecap':'round' });
    needle.setAttribute('transform', `rotate(${GAUGE_MIN_ANGLE} ${GCX} ${GCY})`);
    svg.appendChild(needle);
    svg.appendChild(svgEl('circle', { cx:GCX, cy:GCY, r:7, fill:'#2a2117' }));
    svg.appendChild(svgEl('circle', { cx:GCX, cy:GCY, r:3, fill:'#a9802b' }));

    return needle;
  }

  function setGaugeValue(needle, value, min, max){
    const t = Math.max(0, Math.min(1, (value-min)/(max-min)));
    const angle = GAUGE_MIN_ANGLE + (GAUGE_MAX_ANGLE-GAUGE_MIN_ANGLE)*t;
    needle.setAttribute('transform', `rotate(${angle} ${GCX} ${GCY})`);
  }

  const ampNeedle = buildGauge(document.getElementById('ampGauge'), 0.1, 2, ['0.1','1.0','2.0']);
  const freqNeedle = buildGauge(document.getElementById('freqGauge'), 0.2, 4, ['0.2','2.0','4.0']);
  const lockNeedle = buildGauge(document.getElementById('lockGauge'), 0, 100, ['0','50','100'], 0.85);

  function setLampRow(container, shape){
    container.querySelectorAll('.lamp').forEach(l=> l.classList.toggle('lit', l.dataset.shape === shape));
  }

  function setNewTargetParams(forcedShape){
    const shapes = ['sine','square','saw'];
    const newShape = forcedShape || shapes[Math.floor(Math.random()*3)];
    startMorph(target, newShape, 700);
    target.amp = Math.round((0.4 + Math.random()*1.4) * 100)/100;
    target.freq = Math.round((0.4 + Math.random()*2.6) * 100)/100;
    setLampRow(document.getElementById('targetLamps'), target.shape);
    renderNixie(document.getElementById('tgtAmp'), target.amp.toFixed(2));
    renderNixie(document.getElementById('tgtFreq'), target.freq.toFixed(2));
  }

  function shuffledShapes(){
    const arr = ['sine','square','saw'];
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let quizShapeOrder = ['sine','square','saw'];
  const holdSegs = (function(){
    const ladder = document.getElementById('holdLadder');
    const segs = [];
    for(let i=0;i<10;i++){
      const seg = document.createElement('div');
      seg.className = 'hold-seg';
      ladder.appendChild(seg);
      segs.push(seg);
    }
    return segs;
  })();

  function setHoldProgress(frac){
    const litCount = Math.round(frac * holdSegs.length);
    holdSegs.forEach((seg,i)=> seg.classList.toggle('lit', i < litCount));
  }

  function loadQuizStep(){
    setNewTargetParams(quizShapeOrder[quizIndex]);
    holdStart = null;
    setHoldProgress(0);
    document.getElementById('holdCaption').textContent = 'Hold 0.0s / 1.5s';
    document.getElementById('statusLine').textContent = 'Match the target to start the hold.';
    document.getElementById('statusLine').classList.remove('win');
    document.getElementById('roundBadge').textContent = 'LEVEL ' + (quizIndex + 1) + '/' + QUIZ_LEN;
  }

  function startQuiz(){
    quizDone = false;
    quizIndex = 0;
    quizShapeOrder = shuffledShapes();
    loadQuizStep();
  }

  function finishQuiz(){
    quizDone = true;
    holdStart = null;
    document.getElementById('roundBadge').textContent = 'ALL CLEAR';
    const s = document.getElementById('statusLine');
    s.textContent = 'Solved — all ' + QUIZ_LEN + ' waves matched! Hit "Reset" for a new set.';
    s.classList.add('win');
  }

  function computeMatch(){
    // Simple dial-distance scoring — how close are the controls, not a simulated signal comparison.
    const shapeOk = (user.shape === target.shape) ? 1 : 0;

    const ampTolerance = 1.0;
    const ampScore = Math.max(0, 1 - Math.abs(user.amp - target.amp) / ampTolerance);

    const freqTolerance = 2.0;
    const freqScore = Math.max(0, 1 - Math.abs(user.freq - target.freq) / freqTolerance);

    let lock = shapeOk * ((ampScore + freqScore) / 2);
    lock = Math.max(0, Math.min(1, lock));
    return Math.round(lock * 100);
  }

  function draw(){
    const now = performance.now();
    const tSec = (now - t0) / 1000;

    ctx.clearRect(0,0,W,H);

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--crt-grid');
    ctx.lineWidth = 1;
    const cols = 12, rows = 6;
    for(let c=0;c<=cols;c++){
      const x = (c/cols) * W;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for(let r=0;r<=rows;r++){
      const y = (r/rows) * H;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(61,255,158,0.12)';
    ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();

    const midY = H/2;
    const ampPx = (H/2) * 0.85;
    const cyclesShown = 3;
    const speed = 0.15;

    function plot(obj, color, glow){
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      if(glow){ ctx.shadowColor = color; ctx.shadowBlur = 6; } else { ctx.shadowBlur = 0; }
      for(let px=0; px<=W; px+=2){
        const xdom = (px/W) * cyclesShown - tSec*speed;
        const v = valueFor(obj, xdom);
        const y = midY - v*ampPx/2;
        if(px===0) ctx.moveTo(px,y); else ctx.lineTo(px,y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    plot(target, '#8a6a2a', false);
    plot(target, '#ffb238', true);
    plot(user, '#3dff9e', true);

    const lock = computeMatch();
    setGaugeValue(lockNeedle, lock, 0, 100);
    renderNixie(document.getElementById('lockNixie'), String(lock).padStart(3,'0'));

    if(!quizDone){
      const s = document.getElementById('statusLine');
      if(lock >= 94){
        if(holdStart === null) holdStart = now;
        const elapsed = now - holdStart;
        const frac = Math.min(1, elapsed / HOLD_MS);
        setHoldProgress(frac);
        document.getElementById('holdCaption').textContent = 'Hold ' + (elapsed/1000).toFixed(1) + 's / 1.5s';
        s.textContent = 'Locked — hold steady...';
        s.classList.add('win');
        if(elapsed >= HOLD_MS){
          quizIndex += 1;
          if(quizIndex >= QUIZ_LEN){
            finishQuiz();
          } else {
            loadQuizStep();
          }
        }
      } else {
        holdStart = null;
        setHoldProgress(0);
        document.getElementById('holdCaption').textContent = 'Hold 0.0s / 1.5s';
        s.classList.remove('win');
        s.textContent = lock >= 80 ? 'Almost — fine-tune it to lock in.' : 'Match the target to start the hold.';
      }
    }

    requestAnimationFrame(draw);
  }

  // ---- controls ----
  const ampSlider = document.getElementById('ampSlider');
  const freqSlider = document.getElementById('freqSlider');
  const ampVal = document.getElementById('ampVal');
  const freqVal = document.getElementById('freqVal');
  const shapeBtns = document.querySelectorAll('.shape-btn');

  ampSlider.addEventListener('input', ()=>{
    user.amp = parseFloat(ampSlider.value);
    renderNixie(ampVal, user.amp.toFixed(2));
    setGaugeValue(ampNeedle, user.amp, 0.1, 2);
  });
  freqSlider.addEventListener('input', ()=>{
    user.freq = parseFloat(freqSlider.value);
    renderNixie(freqVal, user.freq.toFixed(2));
    setGaugeValue(freqNeedle, user.freq, 0.2, 4);
  });
  shapeBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      shapeBtns.forEach(b=>b.classList.remove('lit'));
      btn.classList.add('lit');
      startMorph(user, btn.dataset.shape, 450);
    });
  });
  document.querySelector('.shape-btn[data-shape="sine"]').classList.add('lit');

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    startQuiz();
  });

  // initial readouts
  renderNixie(ampVal, user.amp.toFixed(2));
  renderNixie(freqVal, user.freq.toFixed(2));
  setGaugeValue(ampNeedle, user.amp, 0.1, 2);
  setGaugeValue(freqNeedle, user.freq, 0.2, 4);

  resize();
  startQuiz();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
